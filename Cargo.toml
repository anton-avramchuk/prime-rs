[workspace]
resolver = "3"
members = ["crates/*", "benches/*", "showcase", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
leptos = { version = "0.8.22", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", default-features = false }
js-sys = "0.3"
dhat = "0.3"

prime-core = { path = "crates/prime-core" }
prime-dom = { path = "crates/prime-dom" }
prime-theme = { path = "crates/prime-theme" }
prime-icons = { path = "crates/prime-icons" }
prime-badge = { path = "crates/prime-badge" }
prime-button = { path = "crates/prime-button" }
prime-tag = { path = "crates/prime-tag" }
prime-chip = { path = "crates/prime-chip" }
prime-avatar = { path = "crates/prime-avatar" }
prime-divider = { path = "crates/prime-divider" }
prime-card = { path = "crates/prime-card" }
prime-inputtext = { path = "crates/prime-inputtext" }
prime-inputotp = { path = "crates/prime-inputotp" }
prime-scrolltop = { path = "crates/prime-scrolltop" }
prime-password = { path = "crates/prime-password" }
prime-inplace = { path = "crates/prime-inplace" }
prime-splitter = { path = "crates/prime-splitter" }
prime-tabs = { path = "crates/prime-tabs" }
prime-textarea = { path = "crates/prime-textarea" }
prime-checkbox = { path = "crates/prime-checkbox" }
prime-radiobutton = { path = "crates/prime-radiobutton" }
prime-togglebutton = { path = "crates/prime-togglebutton" }
prime-selectbutton = { path = "crates/prime-selectbutton" }
prime-rating = { path = "crates/prime-rating" }
prime-slider = { path = "crates/prime-slider" }
prime-knob = { path = "crates/prime-knob" }
prime-inputnumber = { path = "crates/prime-inputnumber" }
prime-select = { path = "crates/prime-select" }
prime-toggleswitch = { path = "crates/prime-toggleswitch" }
prime-avatargroup = { path = "crates/prime-avatargroup" }
prime-skeleton = { path = "crates/prime-skeleton" }
prime-progressbar = { path = "crates/prime-progressbar" }
prime-message = { path = "crates/prime-message" }
prime-panel = { path = "crates/prime-panel" }
prime-fieldset = { path = "crates/prime-fieldset" }
prime-accordion = { path = "crates/prime-accordion" }
prime-toolbar = { path = "crates/prime-toolbar" }
prime-inputgroup = { path = "crates/prime-inputgroup" }
prime-scrollpanel = { path = "crates/prime-scrollpanel" }
prime-progressspinner = { path = "crates/prime-progressspinner" }
prime-buttongroup = { path = "crates/prime-buttongroup" }
prime-fluid = { path = "crates/prime-fluid" }
prime-iconfield = { path = "crates/prime-iconfield" }
prime-floatlabel = { path = "crates/prime-floatlabel" }
prime-iftalabel = { path = "crates/prime-iftalabel" }
prime-overlaybadge = { path = "crates/prime-overlaybadge" }
prime-breadcrumb = { path = "crates/prime-breadcrumb" }
prime-timeline = { path = "crates/prime-timeline" }
prime-metergroup = { path = "crates/prime-metergroup" }
prime-popover = { path = "crates/prime-popover" }
prime-drawer = { path = "crates/prime-drawer" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
