[workspace]
resolver = "3"
members = ["crates/*", "benches/*", "showcase", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/anton-avramchuk/prime-rs"
homepage = "https://anton-avramchuk.github.io/prime-rs/"
rust-version = "1.98"

[workspace.dependencies]
leptos = { version = "0.8.22", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", default-features = false }
js-sys = "0.3"
dhat = "0.3"

prime-rs-core = { version = "0.1.0", path = "crates/prime-rs-core" }
prime-dom = { version = "0.1.0", path = "crates/prime-dom" }
prime-theme = { version = "0.1.0", path = "crates/prime-theme" }
