[package]
name = "showcase"
description = "Демо-приложение prime-rs (SSR + hydrate), эталон для e2e и сравнения скриншотов"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "showcase"
path = "src/main.rs"

[features]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "dep:wasm-bindgen", "dep:js-sys", "dep:console_error_panic_hook"]
ssr = ["leptos/ssr", "prime-core/ssr", "leptos_router/ssr", "dep:axum", "dep:tokio", "dep:leptos_axum"]

[dependencies]
leptos = { workspace = true }
leptos_router = "0.8"
prime-core = { workspace = true }
prime-badge = { workspace = true }
prime-button = { workspace = true }
prime-tag = { workspace = true }
prime-chip = { workspace = true }
prime-avatar = { workspace = true }
prime-avatargroup = { workspace = true }
prime-panel = { workspace = true }
prime-fieldset = { workspace = true }
prime-accordion = { workspace = true }
prime-toolbar = { workspace = true }
prime-inputgroup = { workspace = true }
prime-buttongroup = { workspace = true }
prime-fluid = { workspace = true }
prime-iconfield = { workspace = true }
prime-floatlabel = { workspace = true }
prime-iftalabel = { workspace = true }
prime-overlaybadge = { workspace = true }
prime-timeline = { workspace = true }
prime-metergroup = { workspace = true }
prime-breadcrumb = { workspace = true }
prime-scrollpanel = { workspace = true }
prime-scrolltop = { workspace = true }
prime-password = { workspace = true }
prime-inplace = { workspace = true }
prime-splitter = { workspace = true }
prime-tabs = { workspace = true }
prime-popover = { workspace = true }
prime-drawer = { workspace = true }
prime-dialog = { workspace = true }
prime-tooltip = { workspace = true }
prime-toast = { workspace = true }
prime-menu = { workspace = true }
prime-listbox = { workspace = true }
prime-multiselect = { workspace = true }
prime-paginator = { workspace = true }
prime-stepper = { workspace = true }
prime-imagecompare = { workspace = true }
prime-blockui = { workspace = true }
prime-splitbutton = { workspace = true }
prime-dock = { workspace = true }
prime-image = { workspace = true }
prime-confirmation = { workspace = true }
prime-confirmpopup = { workspace = true }
prime-confirmdialog = { workspace = true }
prime-speeddial = { workspace = true }
prime-carousel = { workspace = true }
prime-tieredmenu = { workspace = true }
prime-steps = { workspace = true }
prime-contextmenu = { workspace = true }
prime-menubar = { workspace = true }
prime-panelmenu = { workspace = true }
prime-megamenu = { workspace = true }
prime-tree = { workspace = true }
prime-treeselect = { workspace = true }
prime-cascadeselect = { workspace = true }
prime-autocomplete = { workspace = true }
prime-inputmask = { workspace = true }
prime-progressspinner = { workspace = true }
prime-divider = { workspace = true }
prime-inputotp = { workspace = true }
prime-inputtext = { workspace = true }
prime-checkbox = { workspace = true }
prime-radiobutton = { workspace = true }
prime-rating = { workspace = true }
prime-select = { workspace = true }
prime-selectbutton = { workspace = true }
prime-slider = { workspace = true }
prime-knob = { workspace = true }
prime-inputnumber = { workspace = true }
prime-togglebutton = { workspace = true }
prime-toggleswitch = { workspace = true }
prime-message = { workspace = true }
prime-progressbar = { workspace = true }
prime-skeleton = { workspace = true }
prime-textarea = { workspace = true }
prime-card = { workspace = true }
prime-icons = { workspace = true, features = ["all-icons"] }
prime-theme = { workspace = true, features = ["all-components"] }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "DomTokenList", "MouseEvent"] }
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net"], optional = true }
leptos_axum = { version = "0.8", optional = true }

[package.metadata.leptos]
output-name = "showcase"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
lib-profile-release = "release"

[lints]
workspace = true
