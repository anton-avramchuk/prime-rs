name: Pages

# Publishes the static showcase (client-only wasm built with trunk) to GitHub Pages.
# Runs for the tag `pages` and for library release tags `crates_*`, so the site follows each release.
on:
  push:
    tags: ['pages', 'crates_*']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build showcase
        # Size-optimized trunk build (erased view types, opt-level z), theme CSS as a separate file, 404.html for the SPA.
        # The base path is where Pages serves the site, e.g. /prime-rs for https://<user>.github.io/prime-rs/.
        run: cargo xtask pages --base "/${{ github.event.repository.name }}" --dist target/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
