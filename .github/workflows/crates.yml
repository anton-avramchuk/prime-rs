name: Publish crates

# Publishes the library crates to crates.io. Runs only for tags `crates_<version>` (or manually
# with an existing tag). The tag must match the workspace version; re-runs skip versions already published.
on:
  push:
    tags: ['crates_*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. crates_0.1.0"
        required: true

concurrency:
  group: crates-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish in dependency order
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish.py "$TAG"
