name: Weekly (e2e, скриншоты, браузерные бенчмарки)

# Тяжёлые браузерные проверки не запускаются на каждый PR: раз в неделю, вручную
# или на PR с меткой `run-e2e`. Результаты — отчёты, они не блокируют слияние PR.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  e2e:
    name: e2e, скриншоты, замеры памяти
    # На PR — только с меткой run-e2e.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Расхождения с PrimeNG и нестабильность сборки Angular не должны блокировать PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: weekly
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          cache-on-failure: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-leptos

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Закреплённая версия PrimeNG
        id: upstream
        run: |
          echo "commit=$(grep -E '^commit' upstream.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # Эталон строится заново из закреплённого коммита, скриншоты оригинала в репозиторий не коммитятся.
      - name: Клон PrimeNG на закреплённом коммите
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/primefaces/primeng.git "$RUNNER_TEMP/primeng"
          git -C "$RUNNER_TEMP/primeng" checkout "${{ steps.upstream.outputs.commit }}"

      - name: Сборка showcase PrimeNG
        id: upstream_build
        continue-on-error: true
        working-directory: ${{ runner.temp }}/primeng
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter primeng build
          pnpm --filter themes build
          pnpm --filter showcase build

      - name: Сборка нашего showcase
        run: cargo leptos build --release
        working-directory: showcase

      - name: Запуск серверов
        run: |
          (cd showcase && nohup cargo leptos serve --release > "$RUNNER_TEMP/ours.log" 2>&1 &)
          if [ "${{ steps.upstream_build.outcome }}" = "success" ]; then
            # Корень сборки: prerender кладёт index.html и в подкаталоги маршрутов, поэтому берём самый короткий путь.
            out=$(find "$RUNNER_TEMP/primeng/apps/showcase/dist" -name index.html -path '*browser*' | awk '{ print length($0) " " $0 }' | sort -n | head -1 | cut -d' ' -f2- | xargs dirname)
            echo "PrimeNG showcase: $out"
            # SPA: неизвестные пути (/button) отдаём через корень, иначе глубокие ссылки Angular дают 404.
            (nohup npx --yes http-server "$out" -p 4200 -s --proxy "http://127.0.0.1:4200?" > "$RUNNER_TEMP/upstream.log" 2>&1 &)
            npx --yes wait-on http://127.0.0.1:4200 --timeout 60000
          fi
          npx --yes wait-on http://127.0.0.1:3000 --timeout 120000

      - name: Playwright
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          if [ "${{ steps.upstream_build.outcome }}" = "success" ]; then export UPSTREAM_URL=http://127.0.0.1:4200; fi
          npx playwright test

      - name: Отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e/results/
            !e2e/results/artifacts/**/trace*
          retention-days: 7
          if-no-files-found: ignore
