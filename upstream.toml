# PrimeNG version the port is synced with.
version = "21.1.10"
commit = "fe82b291d6fedde177dc12c0af7ef1008dc1b1ff"

# Local PrimeNG clone; overridden by the PRIMENG_PATH environment variable.
path = "C:/Projects/primeng"

# npm packages that theme tokens and component CSS are taken from (versions from PrimeNG's pnpm-workspace.yaml).
[primeuix]
themes = "2.0.3"
styles = "2.0.3"
styled = "0.7.4"
utils = "0.7.2"

# CSS generation settings (`cargo xtask gen-theme`).
[theme]
dark_mode_selector = ".p-dark"
# Components CSS is generated for; a new component is added to the list together with its port.
components = ["badge", "avatar", "button", "card", "accordion", "checkbox", "chip", "divider", "fieldset", "inputtext", "message", "panel", "progressbar", "radiobutton", "skeleton", "tag", "textarea", "select", "iconfield", "inputnumber", "knob", "slider", "rating", "selectbutton", "togglebutton", "toggleswitch", "toolbar", "scrollpanel", "progressspinner", "inputgroup", "buttongroup", "floatlabel", "iftalabel", "overlaybadge", "timeline", "metergroup", "breadcrumb", "inputotp", "scrolltop", "password", "inplace", "splitter", "tabs", "popover", "drawer", "dialog", "tooltip", "toast", "menu", "listbox", "multiselect", "paginator", "stepper", "imagecompare", "blockui", "splitbutton", "dock", "image", "confirmpopup", "confirmdialog", "speeddial", "carousel", "tieredmenu", "steps", "contextmenu", "menubar", "panelmenu", "megamenu", "tree", "treeselect", "cascadeselect", "autocomplete", "inputmask", "colorpicker", "galleria", "fileupload", "orderlist", "picklist", "datepicker", "dataview", "datatable", "treetable"]
# Components for which the `/* For PrimeNG */` block from `<name>style.ts` is taken too (not needed for the rest).
primeng_extra = ["accordion", "togglebutton", "select", "password", "drawer", "listbox", "stepper", "panelmenu", "treeselect", "cascadeselect", "autocomplete", "inputmask", "orderlist", "datatable", "treetable"]
