[package]
name = "prime-paginator"
description = "prime-rs: компонент Paginator (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-icons/ssr", "prime-select/ssr", "prime-inputnumber/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-icons/hydrate", "prime-select/hydrate", "prime-inputnumber/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-icons = { workspace = true, features = ["angledoubleleft", "angledoubleright", "angleleft", "angleright"] }
prime-select = { workspace = true }
prime-inputnumber = { workspace = true }
web-sys = { workspace = true, features = ["Event", "MouseEvent"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlInputElement", "Event", "InputEvent", "InputEventInit", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "EventTarget", "CssStyleDeclaration"] }

[lints]
workspace = true
