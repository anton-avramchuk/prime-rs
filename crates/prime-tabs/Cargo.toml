[package]
name = "prime-tabs"
description = "prime-rs: компонент Tabs (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-icons = { workspace = true, features = ["chevronleft", "chevronright"] }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "DomRect", "Element", "Event", "HtmlCollection", "HtmlElement", "KeyboardEvent", "MouseEvent", "Node", "ResizeObserver", "ScrollIntoViewOptions", "ScrollLogicalPosition", "Window"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Event", "KeyboardEvent", "KeyboardEventInit", "FocusEvent", "MouseEvent", "CssStyleDeclaration", "DomRect"] }

[lints]
workspace = true
