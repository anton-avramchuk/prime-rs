[package]
name = "prime-slider"
description = "prime-rs: Slider component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
web-sys = { workspace = true, features = ["Event", "MouseEvent", "KeyboardEvent", "TouchEvent", "TouchList", "Touch", "HtmlElement", "Element", "DomRect", "Window", "CssStyleDeclaration"] }

# ssr only for native tests: on wasm it breaks client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "CssStyleDeclaration", "DomRect", "Event", "MouseEvent", "MouseEventInit", "KeyboardEvent", "KeyboardEventInit", "FocusEvent", "EventTarget"] }

[lints]
workspace = true
