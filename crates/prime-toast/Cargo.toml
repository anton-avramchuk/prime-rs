[package]
name = "prime-toast"
description = "prime-rs: компонент Toast и MessageService (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-dom/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-dom/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-dom = { workspace = true }
prime-icons = { workspace = true, features = ["times", "check", "infocircle", "timescircle", "exclamationtriangle"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "MouseEvent", "AnimationEvent", "HtmlElement", "Element", "Node", "Document", "Window", "HtmlHeadElement", "CssStyleDeclaration"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Event", "MouseEvent", "MouseEventInit", "CssStyleDeclaration", "HtmlHeadElement"] }

[lints]
workspace = true
