[package]
name = "prime-breadcrumb"
description = "prime-rs: Breadcrumb component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr", "prime-badge/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate", "prime-badge/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
prime-badge = { workspace = true }
prime-icons = { workspace = true, features = ["chevronright", "home"] }
web-sys = { workspace = true, features = ["Event", "MouseEvent"] }

[dev-dependencies]

# ssr is for native tests only: on wasm it breaks client-side event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[lints]
workspace = true
