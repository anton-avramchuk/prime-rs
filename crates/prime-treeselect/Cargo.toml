[package]
name = "prime-treeselect"
description = "prime-rs: компонент TreeSelect (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-dom/ssr", "prime-icons/ssr", "prime-tree/ssr", "prime-chip/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-dom/hydrate", "prime-icons/hydrate", "prime-tree/hydrate", "prime-chip/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-dom = { workspace = true }
prime-tree = { workspace = true }
prime-chip = { workspace = true }
prime-icons = { workspace = true, features = ["chevrondown", "times"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "FocusEvent", "KeyboardEvent", "MouseEvent", "HtmlElement", "HtmlInputElement", "Element", "Node", "Window"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlInputElement", "Event", "InputEvent", "KeyboardEvent", "KeyboardEventInit", "FocusEvent", "MouseEvent", "MouseEventInit"] }

[lints]
workspace = true
