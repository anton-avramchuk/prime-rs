[package]
name = "prime-core"
description = "prime-rs: core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]

[dependencies]
leptos = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Element", "HtmlElement", "CssStyleDeclaration", "DomTokenList", "NodeList", "EventTarget"] }

[dev-dependencies]
dhat = { workspace = true }

[lints]
workspace = true
