[package]
name = "prime-orderlist"
description = "prime-rs: компонент OrderList (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-button/ssr", "prime-listbox/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-button/hydrate", "prime-listbox/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-button = { workspace = true }
prime-listbox = { workspace = true }
prime-icons = { workspace = true, features = ["angleup", "angledown", "angledoubleup", "angledoubledown"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Event", "MouseEvent", "MouseEventInit", "KeyboardEvent", "KeyboardEventInit", "HtmlInputElement"] }

[lints]
workspace = true
