[package]
name = "prime-inputnumber"
description = "prime-rs: компонент InputNumber (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-inputtext/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-inputtext/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-inputtext = { workspace = true }
prime-icons = { workspace = true, features = ["angleup", "angledown", "times"] }
web-sys = { workspace = true, features = ["Event", "InputEvent", "KeyboardEvent", "FocusEvent", "MouseEvent", "HtmlInputElement", "DataTransfer"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlInputElement", "Event", "InputEvent", "InputEventInit", "KeyboardEvent", "KeyboardEventInit", "FocusEvent", "MouseEvent", "MouseEventInit", "EventTarget"] }

[lints]
workspace = true
