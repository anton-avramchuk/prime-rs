[package]
name = "prime-scrollpanel"
description = "prime-rs: компонент ScrollPanel (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration", "DomTokenList", "EventTarget", "Event", "MouseEvent", "KeyboardEvent", "FocusEvent"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "CssStyleDeclaration", "MouseEvent", "MouseEventInit", "Event", "KeyboardEvent", "KeyboardEventInit", "FocusEvent"] }

[lints]
workspace = true
