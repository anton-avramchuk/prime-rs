[package]
name = "prime-datepicker"
description = "prime-rs: компонент DatePicker (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-dom/ssr", "prime-button/ssr", "prime-icons/ssr", "prime-inputtext/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-dom/hydrate", "prime-button/hydrate", "prime-icons/hydrate", "prime-inputtext/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-dom = { workspace = true }
prime-button = { workspace = true }
prime-inputtext = { workspace = true }
prime-icons = { workspace = true, features = ["calendar", "chevronleft", "chevronright", "times"] }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "KeyboardEvent", "MouseEvent", "FocusEvent", "HtmlElement", "HtmlInputElement", "Element", "Node", "Window", "Document", "CssStyleDeclaration", "Navigator"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlInputElement", "Event", "EventInit", "MouseEvent", "MouseEventInit", "KeyboardEvent", "KeyboardEventInit", "FocusEvent"] }

[lints]
workspace = true
