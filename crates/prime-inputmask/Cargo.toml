[package]
name = "prime-inputmask"
description = "prime-rs: InputMask component (port of PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr", "prime-dom/ssr", "prime-icons/ssr", "prime-inputtext/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate", "prime-dom/hydrate", "prime-icons/hydrate", "prime-inputtext/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
prime-dom = { workspace = true }
prime-inputtext = { workspace = true }
prime-icons = { workspace = true, features = ["times"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "FocusEvent", "KeyboardEvent", "MouseEvent", "ClipboardEvent", "InputEvent", "HtmlElement", "HtmlInputElement", "Element", "Node", "Window", "Document"] }

# ssr only for native tests: on wasm it breaks the client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlInputElement", "Event", "EventInit", "KeyboardEvent", "KeyboardEventInit", "FocusEvent", "MouseEvent", "MouseEventInit"] }

[lints]
workspace = true
