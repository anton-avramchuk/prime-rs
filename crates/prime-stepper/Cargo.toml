[package]
name = "prime-stepper"
description = "prime-rs: Stepper component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
web-sys = { workspace = true, features = ["Event", "MouseEvent", "HtmlElement", "Element"] }

# ssr is for native tests only: on wasm it breaks client-side event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Event", "MouseEvent", "MouseEventInit", "EventTarget", "CssStyleDeclaration"] }

[lints]
workspace = true
