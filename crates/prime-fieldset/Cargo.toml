[package]
name = "prime-fieldset"
description = "prime-rs: компонент Fieldset (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-icons = { workspace = true, features = ["minus", "plus"] }
web-sys = { workspace = true, features = ["MouseEvent"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "CssStyleDeclaration", "MouseEvent", "Event", "KeyboardEvent", "KeyboardEventInit"] }

[lints]
workspace = true
