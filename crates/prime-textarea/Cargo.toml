[package]
name = "prime-textarea"
description = "prime-rs: Textarea component (port of PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
web-sys = { workspace = true, features = ["Event", "FocusEvent", "HtmlTextAreaElement", "CssStyleDeclaration", "HtmlElement", "Window"] }

# ssr only for native tests: on wasm it breaks the client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlTextAreaElement", "Event", "InputEvent", "FocusEvent", "CssStyleDeclaration"] }

[lints]
workspace = true
