[package]
name = "prime-confirmation"
description = "prime-rs: Confirmation and ConfirmationService (port of PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr", "prime-button/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate", "prime-button/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
prime-button = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "HtmlElement"] }

# ssr only for native tests: on wasm it breaks the client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[lints]
workspace = true
