[package]
name = "prime-confirmdialog"
description = "prime-rs: ConfirmDialog component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr", "prime-dialog/ssr", "prime-button/ssr", "prime-confirmation/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate", "prime-dialog/hydrate", "prime-button/hydrate", "prime-confirmation/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
prime-dialog = { workspace = true }
prime-button = { workspace = true }
prime-confirmation = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "KeyboardEvent", "MouseEvent", "AnimationEvent", "HtmlElement", "Element", "Node", "Document", "Window", "CssStyleDeclaration", "DomRect", "Navigator"] }

# ssr only for native tests: on wasm it breaks client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlButtonElement", "Event", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "CssStyleDeclaration", "DomTokenList", "DomRect"] }

[lints]
workspace = true
