[package]
name = "prime-colorpicker"
description = "prime-rs: компонент ColorPicker (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-dom/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-dom/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-dom = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "KeyboardEvent", "MouseEvent", "TouchEvent", "TouchList", "Touch", "HtmlElement", "Element", "Node", "Window", "Document", "CssStyleDeclaration", "DomRect", "Navigator"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlInputElement", "Event", "EventInit", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "DomRect", "CssStyleDeclaration", "Navigator"] }

[lints]
workspace = true
