[package]
name = "prime-toolbar"
description = "prime-rs: компонент Toolbar (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[lints]
workspace = true
