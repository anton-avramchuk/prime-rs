[package]
name = "prime-iftalabel"
description = "prime-rs: IftaLabel component (port of PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[lints]
workspace = true
