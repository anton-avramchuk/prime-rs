[package]
name = "prime-image"
description = "prime-rs: компонент Image (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr", "prime-dom/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate", "prime-dom/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
prime-dom = { workspace = true }
prime-icons = { workspace = true, features = ["eye", "refresh", "undo", "searchminus", "searchplus", "times"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "KeyboardEvent", "MouseEvent", "AnimationEvent", "ErrorEvent", "HtmlElement", "Element"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlImageElement", "HtmlButtonElement", "Event", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "CssStyleDeclaration", "DomTokenList"] }

[lints]
workspace = true
