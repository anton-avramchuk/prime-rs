[package]
name = "prime-splitter"
description = "prime-rs: Splitter component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "DomRect", "Element", "Event", "EventTarget", "KeyboardEvent", "MouseEvent", "Storage", "Touch", "TouchEvent", "TouchList", "Window"] }

# ssr only for native tests: on wasm it breaks client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Event", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "CssStyleDeclaration", "Storage", "DomRect"] }

[lints]
workspace = true
