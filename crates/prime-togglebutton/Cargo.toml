[package]
name = "prime-togglebutton"
description = "prime-rs: ToggleButton component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
web-sys = { workspace = true, features = ["Event", "FocusEvent", "KeyboardEvent", "MouseEvent"] }

# ssr only for native tests: on wasm it breaks client-side event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "Event", "FocusEvent", "KeyboardEvent", "KeyboardEventInit", "MouseEvent"] }

[lints]
workspace = true
