[package]
name = "prime-rating"
description = "prime-rs: Rating component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
prime-icons = { workspace = true, features = ["star", "starfill"] }
web-sys = { workspace = true, features = ["Element", "Event", "FocusEvent", "HtmlInputElement", "MouseEvent"] }

# ssr is for native tests only: on wasm it breaks client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlInputElement", "Event", "FocusEvent", "MouseEvent"] }

[lints]
workspace = true
