[package]
name = "prime-accordion"
description = "prime-rs: Accordion component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
prime-icons = { workspace = true, features = ["chevrondown", "chevronup"] }
web-sys = { workspace = true, features = ["Element", "HtmlElement", "HtmlCollection", "KeyboardEvent", "FocusEvent", "MouseEvent", "Event"] }

# ssr only for native tests: on wasm it breaks client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "CssStyleDeclaration", "MouseEvent", "Event", "KeyboardEvent", "KeyboardEventInit"] }

[lints]
workspace = true
