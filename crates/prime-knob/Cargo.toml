[package]
name = "prime-knob"
description = "prime-rs: компонент Knob (порт PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-core/ssr"]
hydrate = ["leptos/hydrate", "prime-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-core = { workspace = true }
web-sys = { workspace = true, features = ["Event", "MouseEvent", "KeyboardEvent", "TouchEvent", "TouchList", "Touch", "HtmlElement", "Element", "DomRect"] }

# ssr только для нативных тестов: на wasm он ломает клиентские обработчики событий.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "DomRect", "Event", "MouseEvent", "MouseEventInit", "KeyboardEvent", "KeyboardEventInit", "EventTarget"] }

[lints]
workspace = true
