[package]
name = "prime-carousel"
description = "prime-rs: Carousel component (PrimeNG port)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr", "prime-button/ssr", "prime-icons/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate", "prime-button/hydrate", "prime-icons/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }
prime-button = { workspace = true }
prime-icons = { workspace = true, features = ["chevronleft", "chevronright", "chevronup", "chevrondown"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["Event", "EventTarget", "KeyboardEvent", "MouseEvent", "TouchEvent", "TouchList", "Touch", "HtmlElement", "Element", "Window", "Node"] }

# ssr only for native tests: on wasm it breaks client event handlers.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
leptos = { workspace = true, features = ["csr"] }
js-sys = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = ["Document", "Window", "Element", "HtmlElement", "HtmlButtonElement", "Event", "EventInit", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "TouchEvent", "TouchEventInit", "TouchList", "Touch", "TouchInit", "CssStyleDeclaration", "DomTokenList"] }

[lints]
workspace = true
