[package]
name = "prime-fluid"
description = "prime-rs: Fluid component (port of PrimeNG)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
ssr = ["leptos/ssr", "prime-rs-core/ssr"]
hydrate = ["leptos/hydrate", "prime-rs-core/hydrate"]

[dependencies]
leptos = { workspace = true }
prime-rs-core = { workspace = true }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }
prime-button = { workspace = true, features = ["ssr"] }
prime-inputnumber = { workspace = true, features = ["ssr"] }
prime-inputtext = { workspace = true, features = ["ssr"] }
prime-select = { workspace = true, features = ["ssr"] }
prime-textarea = { workspace = true, features = ["ssr"] }

[lints]
workspace = true
