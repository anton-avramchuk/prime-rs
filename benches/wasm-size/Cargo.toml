[package]
name = "wasm-size"
description = "Минимальное wasm-приложение для измерения вклада компонентов в размер бинарника"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Случаи измерения: ровно один должен быть включён.
case-baseline = []
case-one-icon = ["prime-icons/check"]
case-all-icons = ["prime-icons/all-icons"]
case-badge = ["dep:prime-badge"]
case-button = ["dep:prime-button"]
case-tag = ["dep:prime-tag"]
case-chip = ["dep:prime-chip"]
case-avatar = ["dep:prime-avatar"]
case-divider = ["dep:prime-divider"]
case-card = ["dep:prime-card"]
case-textarea = ["dep:prime-textarea"]
case-panel = ["dep:prime-panel"]
case-fieldset = ["dep:prime-fieldset"]
case-accordion = ["dep:prime-accordion"]
case-toolbar = ["dep:prime-toolbar"]
case-inputgroup = ["dep:prime-inputgroup"]
case-buttongroup = ["dep:prime-buttongroup"]
case-fluid = ["dep:prime-fluid"]
case-iconfield = ["dep:prime-iconfield"]
case-floatlabel = ["dep:prime-floatlabel"]
case-iftalabel = ["dep:prime-iftalabel"]
case-overlaybadge = ["dep:prime-overlaybadge"]
case-timeline = ["dep:prime-timeline"]
case-metergroup = ["dep:prime-metergroup"]
case-breadcrumb = ["dep:prime-breadcrumb"]
case-inputotp = ["dep:prime-inputotp"]
case-scrolltop = ["dep:prime-scrolltop"]
case-scrollpanel = ["dep:prime-scrollpanel"]
case-progressspinner = ["dep:prime-progressspinner"]
case-skeleton = ["dep:prime-skeleton"]
case-avatargroup = ["dep:prime-avatargroup"]
case-progressbar = ["dep:prime-progressbar"]
case-message = ["dep:prime-message"]
case-rating = ["dep:prime-rating"]
case-selectbutton = ["dep:prime-selectbutton"]
case-slider = ["dep:prime-slider"]
case-knob = ["dep:prime-knob"]
case-select = ["dep:prime-select"]
case-inputnumber = ["dep:prime-inputnumber"]
case-togglebutton = ["dep:prime-togglebutton"]
case-toggleswitch = ["dep:prime-toggleswitch"]
case-radiobutton = ["dep:prime-radiobutton"]
case-checkbox = ["dep:prime-checkbox"]
case-inputtext = ["dep:prime-inputtext"]

[dependencies]
cfg-if = "1"
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
prime-icons = { workspace = true }
prime-badge = { workspace = true, optional = true }
prime-button = { workspace = true, optional = true }
prime-tag = { workspace = true, optional = true }
prime-chip = { workspace = true, optional = true }
prime-avatar = { workspace = true, optional = true }
prime-divider = { workspace = true, optional = true }
prime-card = { workspace = true, optional = true }
prime-textarea = { workspace = true, optional = true }
prime-panel = { workspace = true, optional = true }
prime-fieldset = { workspace = true, optional = true }
prime-accordion = { workspace = true, optional = true }
prime-toolbar = { workspace = true, optional = true }
prime-inputgroup = { workspace = true, optional = true }
prime-overlaybadge = { workspace = true, optional = true }
prime-timeline = { workspace = true, optional = true }
prime-metergroup = { workspace = true, optional = true }
prime-breadcrumb = { workspace = true, optional = true }
prime-inputotp = { workspace = true, optional = true }
prime-scrolltop = { workspace = true, optional = true }
prime-buttongroup = { workspace = true, optional = true }
prime-fluid = { workspace = true, optional = true }
prime-iconfield = { workspace = true, optional = true }
prime-floatlabel = { workspace = true, optional = true }
prime-iftalabel = { workspace = true, optional = true }
prime-scrollpanel = { workspace = true, optional = true }
prime-progressspinner = { workspace = true, optional = true }
prime-skeleton = { workspace = true, optional = true }
prime-avatargroup = { workspace = true, optional = true }
prime-progressbar = { workspace = true, optional = true }
prime-message = { workspace = true, optional = true }
prime-rating = { workspace = true, optional = true }
prime-selectbutton = { workspace = true, optional = true }
prime-slider = { workspace = true, optional = true }
prime-knob = { workspace = true, optional = true }
prime-select = { workspace = true, optional = true }
prime-inputnumber = { workspace = true, optional = true }
prime-togglebutton = { workspace = true, optional = true }
prime-toggleswitch = { workspace = true, optional = true }
prime-radiobutton = { workspace = true, optional = true }
prime-checkbox = { workspace = true, optional = true }
prime-inputtext = { workspace = true, optional = true }

[lints]
workspace = true
