[package]
name = "wasm-size"
description = "Минимальное wasm-приложение для измерения вклада компонентов в размер бинарника"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Случаи измерения: ровно один должен быть включён.
case-baseline = []
case-one-icon = ["prime-icons/check"]
case-all-icons = ["prime-icons/all-icons"]
case-badge = ["dep:prime-badge"]
case-button = ["dep:prime-button"]
case-tag = ["dep:prime-tag"]
case-chip = ["dep:prime-chip"]
case-avatar = ["dep:prime-avatar"]
case-divider = ["dep:prime-divider"]
case-card = ["dep:prime-card"]
case-inputtext = ["dep:prime-inputtext"]

[dependencies]
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
prime-icons = { workspace = true }
prime-badge = { workspace = true, optional = true }
prime-button = { workspace = true, optional = true }
prime-tag = { workspace = true, optional = true }
prime-chip = { workspace = true, optional = true }
prime-avatar = { workspace = true, optional = true }
prime-divider = { workspace = true, optional = true }
prime-card = { workspace = true, optional = true }
prime-inputtext = { workspace = true, optional = true }

[lints]
workspace = true
