[package]
name = "wasm-size"
description = "Минимальное wasm-приложение для измерения вклада компонентов в размер бинарника"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Случаи измерения: ровно один должен быть включён.
case-baseline = []
case-one-icon = ["prime-icons/check"]
case-all-icons = ["prime-icons/all-icons"]
case-badge = ["dep:prime-badge"]
case-button = ["dep:prime-button"]
case-tag = ["dep:prime-tag"]
case-chip = ["dep:prime-chip"]
case-avatar = ["dep:prime-avatar"]
case-divider = ["dep:prime-divider"]
case-card = ["dep:prime-card"]
case-textarea = ["dep:prime-textarea"]
case-panel = ["dep:prime-panel"]
case-fieldset = ["dep:prime-fieldset"]
case-skeleton = ["dep:prime-skeleton"]
case-avatargroup = ["dep:prime-avatargroup"]
case-progressbar = ["dep:prime-progressbar"]
case-message = ["dep:prime-message"]
case-toggleswitch = ["dep:prime-toggleswitch"]
case-radiobutton = ["dep:prime-radiobutton"]
case-checkbox = ["dep:prime-checkbox"]
case-inputtext = ["dep:prime-inputtext"]

[dependencies]
leptos = { workspace = true, features = ["csr"] }
wasm-bindgen = { workspace = true }
prime-icons = { workspace = true }
prime-badge = { workspace = true, optional = true }
prime-button = { workspace = true, optional = true }
prime-tag = { workspace = true, optional = true }
prime-chip = { workspace = true, optional = true }
prime-avatar = { workspace = true, optional = true }
prime-divider = { workspace = true, optional = true }
prime-card = { workspace = true, optional = true }
prime-textarea = { workspace = true, optional = true }
prime-panel = { workspace = true, optional = true }
prime-fieldset = { workspace = true, optional = true }
prime-skeleton = { workspace = true, optional = true }
prime-avatargroup = { workspace = true, optional = true }
prime-progressbar = { workspace = true, optional = true }
prime-message = { workspace = true, optional = true }
prime-toggleswitch = { workspace = true, optional = true }
prime-radiobutton = { workspace = true, optional = true }
prime-checkbox = { workspace = true, optional = true }
prime-inputtext = { workspace = true, optional = true }

[lints]
workspace = true
