# Бюджеты аллокаций на экземпляр при SSR-рендере (`cargo bench -p render-bench --bench alloc`, затем `cargo xtask alloc-budget`).
# Измерено после change `optimize-reactive-props`: badge 8, button 20, button-full 50 аллокаций на экземпляр; бюджет с запасом ≈ 20 %.
# Новый компонент добавляет сюда сценарий вида `<имя>-1000`.

[[scenario]]
name = "badge-1000"
instances = 1000
max_per_instance = 10

[[scenario]]
name = "button-1000"
instances = 1000
max_per_instance = 24

[[scenario]]
name = "button-full-1000"
instances = 1000
max_per_instance = 60
