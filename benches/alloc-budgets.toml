# Бюджеты аллокаций на экземпляр при SSR-рендере (`cargo bench -p render-bench --bench alloc`, затем `cargo xtask alloc-budget`).
# Измерено после change `static-render-path`: badge 8, button 23, button-full 56 аллокаций на экземпляр (статическая ветвь считает значения
# один раз, поэтому на 3–6 аллокаций больше, чем после `optimize-reactive-props`: 8, 20, 50); бюджет с запасом ≈ 20 %.
# Новый компонент добавляет сюда сценарий вида `<имя>-1000`.

[[scenario]]
name = "badge-1000"
instances = 1000
max_per_instance = 10

[[scenario]]
name = "button-1000"
instances = 1000
max_per_instance = 28

[[scenario]]
name = "button-full-1000"
instances = 1000
max_per_instance = 68
