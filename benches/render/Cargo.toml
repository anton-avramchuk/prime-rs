[package]
name = "render-bench"
description = "Бенчмарки SSR-рендера и аллокаций компонентов prime-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
leptos = { workspace = true, features = ["ssr"] }
prime-icons = { workspace = true, features = ["check", "spinner", "all-icons"] }
prime-badge = { workspace = true, features = ["ssr"] }
prime-button = { workspace = true, features = ["ssr"] }
prime-tag = { workspace = true, features = ["ssr"] }
prime-chip = { workspace = true, features = ["ssr"] }
prime-textarea = { workspace = true, features = ["ssr"] }
prime-panel = { workspace = true, features = ["ssr"] }
prime-fieldset = { workspace = true, features = ["ssr"] }
prime-accordion = { workspace = true, features = ["ssr"] }
prime-toolbar = { workspace = true, features = ["ssr"] }
prime-inputgroup = { workspace = true, features = ["ssr"] }
prime-scrollpanel = { workspace = true, features = ["ssr"] }
prime-progressspinner = { workspace = true, features = ["ssr"] }
prime-skeleton = { workspace = true, features = ["ssr"] }
prime-avatargroup = { workspace = true, features = ["ssr"] }
prime-progressbar = { workspace = true, features = ["ssr"] }
prime-message = { workspace = true, features = ["ssr"] }
prime-toggleswitch = { workspace = true, features = ["ssr"] }
prime-radiobutton = { workspace = true, features = ["ssr"] }
prime-checkbox = { workspace = true, features = ["ssr"] }
prime-inputtext = { workspace = true, features = ["ssr"] }
prime-avatar = { workspace = true, features = ["ssr"] }
prime-divider = { workspace = true, features = ["ssr"] }
prime-card = { workspace = true, features = ["ssr"] }
serde_json = "1"

[dev-dependencies]
divan = "0.1"
dhat = { workspace = true }

[[bench]]
name = "render"
harness = false

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "time"
harness = false

[lints]
workspace = true
