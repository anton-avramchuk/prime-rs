# Бюджеты вклада компонентов в размер wasm.
# Мера: размер сырого .wasm (release, wasm32-unknown-unknown, без wasm-opt) минус размер `case-baseline`
# приложения `benches/wasm-size`. Проверяется `cargo xtask wasm-size`.
# Первые значения — измеренный вклад с запасом ≈ 50 %; пересмотреть после появления первых компонентов.

# one-icon: после optimize-allocs иконка использует ClassNames::finish_cow (интернирование), +≈3 КБ.
[[case]]
name = "one-icon"
feature = "case-one-icon"
max_delta_bytes = 15500

[[case]]
name = "all-icons"
feature = "case-all-icons"
max_delta_bytes = 190000

[[case]]
name = "badge"
feature = "case-badge"
max_delta_bytes = 170000

[[case]]
name = "button"
feature = "case-button"
max_delta_bytes = 570000

[[case]]
name = "tag"
feature = "case-tag"
max_delta_bytes = 140000

[[case]]
name = "chip"
feature = "case-chip"
max_delta_bytes = 230000

[[case]]
name = "avatar"
feature = "case-avatar"
max_delta_bytes = 180000

[[case]]
name = "divider"
feature = "case-divider"
max_delta_bytes = 130000

[[case]]
name = "card"
feature = "case-card"
max_delta_bytes = 130000

